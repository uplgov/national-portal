<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAAG Projects</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-body: #f5f7fb;
      --bg-surface: #ffffff;
      --text-primary: #1a1f2e;
      --text-secondary: #2d3e50;
      --text-muted: #4a5568;
      --border-light: #e2e8f0;
      --border-table: #e9edf2;
      --header-bg: #f8fafc;
      --hover-bg: #eef3fc;
      --badge-bg: #e2e8f0;
      --badge-text: #334155;
      --btn-bg: #eef2f6;
      --btn-hover: #e2e8f0;
      --banner-bg: #2c3e50;
      --banner-text: #ffffff;
      --warning-bg: #e6b42220;
      --warning-text: #ffecb3;
      --footer-text: #7c8ba0;
      --dialog-bg: #ffffff;
      --dialog-text: #1a1f2e;
      --dialog-border: #cbd5e1;
      --resizer-bg: #cbd5e1;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-body: #121212;
        --bg-surface: #1e1e2f;
        --text-primary: #eef2ff;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --border-light: #2d3748;
        --border-table: #2a2a3a;
        --header-bg: #1a1a2a;
        --hover-bg: #2a2a3e;
        --badge-bg: #2d3748;
        --badge-text: #cbd5e6;
        --btn-bg: #2d3748;
        --btn-hover: #3a4458;
        --banner-bg: #1e2a3a;
        --banner-text: #e2e8f0;
        --warning-bg: #e6b42230;
        --warning-text: #fde047;
        --footer-text: #6b7280;
        --dialog-bg: #2a2a3a;
        --dialog-text: #eef2ff;
        --dialog-border: #4a5568;
        --resizer-bg: #4a5568;
      }
    }

    body {
      font-family: 'Georgia', 'Times New Roman', Times, serif;
      background: var(--bg-body);
      color: var(--text-primary);
      line-height: 1.5;
    }

    .translate-banner {
      background: var(--banner-bg);
      color: var(--banner-text);
      padding: 0.75rem 1.5rem;
      display: none;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.85rem;
      border-bottom: 1px solid rgba(0,0,0,0.2);
      font-family: 'Georgia', 'Times New Roman', Times, serif;
    }

    .translate-banner.show {
      display: flex;
    }

    .warning-msg {
      background: var(--warning-bg);
      color: var(--warning-text);
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
      font-size: 0.75rem;
    }

    .close-banner {
      background: none;
      border: none;
      color: var(--banner-text);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0 0.4rem;
      opacity: 0.7;
      font-family: monospace;
    }

    .close-banner:hover {
      opacity: 1;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 2rem 2rem 4rem 2rem;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-bottom: 2rem;
      border-bottom: 2px solid var(--border-light);
      padding-bottom: 1.25rem;
    }

    .nav-area {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .naag-btn {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.2px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.25rem 0;
      color: var(--text-secondary);
      transition: color 0.15s;
      text-decoration: none;
      font-family: 'Georgia', 'Times New Roman', Times, serif;
    }

    .naag-btn:hover {
      color: #1e6f9f;
      text-decoration: underline;
    }

    .all-projects-label {
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: normal;
    }

    .controls-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .icon-btn {
      background: var(--btn-bg);
      border: 1px solid var(--border-light);
      padding: 0.45rem 1rem;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
      font-family: 'Georgia', 'Times New Roman', Times, serif;
      color: var(--text-primary);
    }

    .icon-btn:hover {
      background: var(--btn-hover);
    }

    .filter-group {
      display: flex;
      gap: 1.2rem;
      background: var(--btn-bg);
      padding: 0.4rem 1rem;
      border-radius: 4px;
    }

    .filter-group label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
    }

    .filter-group input {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #1e6f9f;
    }

    .search-box {
      padding: 0.45rem 0.9rem;
      font-size: 0.9rem;
      border: 1px solid var(--border-light);
      border-radius: 4px;
      background: var(--bg-surface);
      color: var(--text-primary);
      width: 220px;
      outline: none;
      transition: 0.2s;
      font-family: 'Georgia', 'Times New Roman', Times, serif;
    }

    .search-box:focus {
      border-color: #1e6f9f;
      box-shadow: 0 0 0 2px rgba(30,111,159,0.2);
    }

    .projects-table-wrapper {
      overflow-x: auto;
      width: 100%;
    }

    .projects-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
      table-layout: fixed;
      min-width: 500px;
    }

    .projects-table th {
      text-align: left;
      padding: 1rem 0.75rem 0.9rem 0.75rem;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-light);
      background: var(--header-bg);
      font-family: 'Georgia', 'Times New Roman', Times, serif;
      position: relative;
    }

    .projects-table td {
      padding: 1rem 0.75rem;
      border-bottom: 1px solid var(--border-table);
      vertical-align: middle;
      font-size: 0.9rem;
      word-break: break-word;
      white-space: normal;
    }

    .resize-handle {
      position: absolute;
      top: 0;
      right: -4px;
      width: 8px;
      height: 100%;
      cursor: col-resize;
      background: transparent;
      z-index: 10;
    }

    .resize-handle:hover {
      background: var(--resizer-bg);
      opacity: 0.5;
    }

    .project-row {
      transition: background 0.12s;
      cursor: pointer;
    }

    .project-row:hover {
      background: var(--hover-bg);
    }

    .project-name {
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: -0.2px;
      color: var(--text-secondary);
    }

    .non-naag-badge {
      display: inline-block;
      background: var(--badge-bg);
      font-size: 0.7rem;
      font-weight: 500;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      margin-left: 0.6rem;
      color: var(--badge-text);
      vertical-align: middle;
    }

    .nick-col, .time-col {
      color: var(--text-primary);
    }

    .empty-folder-msg {
      padding: 2rem;
      text-align: center;
      color: var(--text-muted);
      font-style: italic;
      background: var(--bg-surface);
      border-radius: 8px;
    }

    .loading, .error-msg {
      padding: 2.5rem;
      text-align: center;
      font-size: 1rem;
      background: var(--bg-surface);
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .error-msg {
      color: #b91c1c;
      background: #fff5f5;
    }

    @media (prefers-color-scheme: dark) {
      .error-msg {
        color: #f87171;
        background: #2a1a1a;
      }
    }

    footer {
      margin-top: 3rem;
      text-align: center;
      font-size: 0.7rem;
      color: var(--footer-text);
      border-top: 1px solid var(--border-light);
      padding-top: 2rem;
    }

    .custom-dialog-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      font-family: 'Georgia', 'Times New Roman', Times, serif;
    }

    .custom-dialog {
      background: var(--dialog-bg);
      color: var(--dialog-text);
      border-radius: 8px;
      max-width: 460px;
      width: 90%;
      padding: 1.5rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      border: 1px solid var(--dialog-border);
    }

    .custom-dialog p {
      margin-bottom: 1.2rem;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .dialog-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .dialog-buttons button {
      padding: 0.4rem 1rem;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-family: 'Georgia', 'Times New Roman', Times, serif;
      font-size: 0.85rem;
    }

    .dialog-activate {
      background: #1e6f9f;
      color: white;
    }

    .dialog-activate:hover {
      background: #0f5a84;
    }

    .dialog-close {
      background: var(--btn-bg);
      color: var(--text-primary);
      border: 1px solid var(--border-light);
    }

    @media (max-width: 700px) {
      .container {
        padding: 1.25rem;
      }
      .header-row {
        flex-direction: column;
        align-items: stretch;
      }
      .controls-bar {
        justify-content: stretch;
        flex-direction: column;
        align-items: stretch;
      }
      .filter-group {
        justify-content: center;
      }
      .search-box {
        width: 100%;
      }
      .projects-table th, .projects-table td {
        padding: 0.85rem 0.5rem;
      }
      .project-name {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

<div id="translateBanner" class="translate-banner">
  <div id="google_translate_element"></div>
  <div class="warning-msg">Warning: Translation tools may be inaccurate.</div>
  <button id="closeTranslateBanner" class="close-banner" aria-label="Close">X</button>
</div>

<div class="container">
  <div class="header-row">
    <div class="nav-area">
      <a href="https://uplgov.github.io/national-portal/naag" class="naag-btn">NAAG</a>
      <span class="all-projects-label">&lt; All Projects</span>
    </div>
    <div class="controls-bar">
      <div class="filter-group">
        <label>
          <input type="checkbox" id="showNaagCheckbox" checked> NAAG Projects only
        </label>
        <label>
          <input type="checkbox" id="showNonNaagCheckbox" checked> non-NAAG Projects only
        </label>
      </div>
      <button id="langInfoBtn" class="icon-btn">A/文</button>
      <input type="text" id="searchInput" class="search-box" placeholder="Search projects..." autocomplete="off">
    </div>
  </div>

  <div class="projects-table-wrapper" id="tableWrapper">
    <div id="projectsContainer">
      <div class="loading">Loading projects...</div>
    </div>
  </div>
  <footer>NAAG · project directory</footer>
</div>

<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'en',
      includedLanguages: 'en,fr,de,es,it,pt,ru,zh-CN,zh-TW,ja,ko,ar',
      layout: google.translate.TranslateElement.InlineLayout.HORIZONTAL
    }, 'google_translate_element');
  }
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<script>
  (function() {
    const GITHUB_API_BASE = 'https://api.github.com/repos/uplgov/national-portal/contents/naag/projects';
    const REPO_RAW_BASE = 'https://raw.githubusercontent.com/uplgov/national-portal/main/naag/projects';
    const projectsContainer = document.getElementById('projectsContainer');
    const searchInput = document.getElementById('searchInput');
    const showNaagCheckbox = document.getElementById('showNaagCheckbox');
    const showNonNaagCheckbox = document.getElementById('showNonNaagCheckbox');
    const langInfoBtn = document.getElementById('langInfoBtn');
    const translateBanner = document.getElementById('translateBanner');
    const closeTranslateBanner = document.getElementById('closeTranslateBanner');

    let allProjects = [];

    function isNaagFolder(folderName) {
      return /^naag\d*$/i.test(folderName);
    }

    function formatProjectTitle(folderName) {
      const match = folderName.match(/^naag(\d+)$/i);
      if (match) {
        const number = match[1];
        return `NAAG ${number}`;
      }
      return folderName;
    }

    async function fetchTextContent(url) {
      try {
        const resp = await fetch(url);
        if (!resp.ok) return null;
        const text = await resp.text();
        return text.trim() || '';
      } catch (_) {
        return null;
      }
    }

    async function getFolderContents() {
      try {
        const response = await fetch(GITHUB_API_BASE);
        if (!response.ok) {
          throw new Error(`GitHub API error: ${response.status}`);
        }
        const data = await response.json();
        if (!Array.isArray(data)) throw new Error('Invalid API response');
        const folders = data.filter(item => item.type === 'dir');
        const projectsData = [];
        for (const folder of folders) {
          const folderName = folder.name;
          const nickRawUrl = `${REPO_RAW_BASE}/${folderName}/nick.txt`;
          const timeRawUrl = `${REPO_RAW_BASE}/${folderName}/time.txt`;
          const [nickContent, timeContent] = await Promise.all([
            fetchTextContent(nickRawUrl),
            fetchTextContent(timeRawUrl)
          ]);
          projectsData.push({
            folderName: folderName,
            isNaag: isNaagFolder(folderName),
            displayTitle: formatProjectTitle(folderName),
            nick: nickContent !== null ? nickContent : '',
            time: timeContent !== null ? timeContent : ''
          });
        }
        return projectsData;
      } catch (err) {
        console.error(err);
        throw err;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    function applyFiltersAndSearch() {
      let filtered = [...allProjects];

      const showNaag = showNaagCheckbox.checked;
      const showNonNaag = showNonNaagCheckbox.checked;

      if (!showNaag && !showNonNaag) {
        filtered = [];
      } else if (showNaag && !showNonNaag) {
        filtered = filtered.filter(p => p.isNaag === true);
      } else if (!showNaag && showNonNaag) {
        filtered = filtered.filter(p => p.isNaag === false);
      }

      const searchTerm = searchInput.value.trim().toLowerCase();
      if (searchTerm !== '') {
        filtered = filtered.filter(proj => {
          return proj.displayTitle.toLowerCase().includes(searchTerm) ||
                 (proj.nick && proj.nick.toLowerCase().includes(searchTerm)) ||
                 (proj.time && proj.time.toLowerCase().includes(searchTerm));
        });
      }

      renderProjects(filtered);
    }

    function initColumnResizing(table) {
      const ths = table.querySelectorAll('th');
      if (ths.length < 3) return;
      let startX, startWidth;
      let currentTh;

      const createResizer = (th) => {
        const resizer = document.createElement('div');
        resizer.className = 'resize-handle';
        th.appendChild(resizer);
        resizer.addEventListener('mousedown', (e) => {
          e.preventDefault();
          e.stopPropagation();
          startX = e.clientX;
          currentTh = th;
          startWidth = th.offsetWidth;
          document.body.style.cursor = 'col-resize';
          document.body.style.userSelect = 'none';
        });
      };

      ths.forEach(th => createResizer(th));

      document.addEventListener('mousemove', (e) => {
        if (!currentTh) return;
        const diff = e.clientX - startX;
        const newWidth = startWidth + diff;
        if (newWidth > 80) {
          currentTh.style.width = newWidth + 'px';
        }
      });

      document.addEventListener('mouseup', () => {
        if (currentTh) {
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
          currentTh = null;
        }
      });
    }

    function renderProjects(projectsToRender) {
      if (!projectsContainer) return;
      if (!projectsToRender.length) {
        projectsContainer.innerHTML = `<div class="empty-folder-msg">No projects match the current filters or search.</div>`;
        return;
      }

      const tableHtml = `
        <table class="projects-table" id="resizableTable">
          <thead>
            <tr>
              <th style="width: 30%">PROJECT NAME</th>
              <th style="width: 35%">NICKNAME</th>
              <th style="width: 35%">TIME</th>
            </tr>
          </thead>
          <tbody>
            ${projectsToRender.map(proj => {
              const nameDisplay = proj.isNaag ? proj.displayTitle : `${escapeHtml(proj.displayTitle)} <span class="non-naag-badge">other</span>`;
              return `
              <tr class="project-row" data-folder="${escapeHtml(proj.folderName)}">
                <td class="project-name">${nameDisplay}</td>
                <td class="nick-col">${escapeHtml(proj.nick || '—')}</td>
                <td class="time-col">${escapeHtml(proj.time || '—')}</td>
              </tr>
            `;
            }).join('')}
          </tbody>
        </table>
      `;
      projectsContainer.innerHTML = tableHtml;

      const table = document.getElementById('resizableTable');
      if (table) initColumnResizing(table);

      const rows = document.querySelectorAll('.project-row');
      rows.forEach(row => {
        const folder = row.getAttribute('data-folder');
        row.addEventListener('click', (e) => {
          e.stopPropagation();
          if (folder) {
            const targetUrl = `https://uplgov.github.io/national-portal/naag/projects/${folder}/index.htm`;
            window.location.href = targetUrl;
          }
        });
      });
    }

    function debounce(fn, delay) {
      let timer;
      return function(...args) {
        clearTimeout(timer);
        timer = setTimeout(() => fn.apply(this, args), delay);
      };
    }

    function showLanguageDialog() {
      const overlay = document.createElement('div');
      overlay.className = 'custom-dialog-overlay';
      overlay.innerHTML = `
        <div class="custom-dialog">
          <p>This is an academic website of UPL; therefore, it only supports English. You may use the Google Translate plugin to view a translation.</p>
          <div class="dialog-buttons">
            <button class="dialog-activate" id="dialogActivateBtn">Activate Google Translate</button>
            <button class="dialog-close" id="dialogCloseBtn">Close</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      const activateBtn = overlay.querySelector('#dialogActivateBtn');
      const closeBtn = overlay.querySelector('#dialogCloseBtn');
      activateBtn.addEventListener('click', () => {
        translateBanner.classList.add('show');
        overlay.remove();
      });
      closeBtn.addEventListener('click', () => {
        overlay.remove();
      });
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.remove();
      });
    }

    langInfoBtn.addEventListener('click', showLanguageDialog);

    closeTranslateBanner.addEventListener('click', () => {
      translateBanner.classList.remove('show');
    });

    function init() {
      getFolderContents()
        .then(projects => {
          allProjects = projects;
          if (allProjects.length === 0) {
            projectsContainer.innerHTML = `<div class="empty-folder-msg">No project folders found. Create folders like 'naag1' or 'johnmattew22' inside naag/projects/</div>`;
            return;
          }
          applyFiltersAndSearch();
        })
        .catch(err => {
          projectsContainer.innerHTML = `<div class="error-msg">Failed to load projects: ${err.message}. Check API: https://api.github.com/repos/uplgov/national-portal/contents/naag/projects</div>`;
        });

      const debouncedFilter = debounce(applyFiltersAndSearch, 180);
      searchInput.addEventListener('input', debouncedFilter);
      showNaagCheckbox.addEventListener('change', applyFiltersAndSearch);
      showNonNaagCheckbox.addEventListener('change', applyFiltersAndSearch);
    }

    init();
  })();
</script>
</body>
</html>
